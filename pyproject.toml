[build-system]
requires = ["setuptools>=59.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator and BFS shortest-path solver (42 A-Maze-ing)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [
    {name = "gustde-s", email = "gustavo.hdsbrito@gmail.com"}
]
dependencies = []

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "pytest",
    "build",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = "(^|/)(\\.venv|venv|ENV|build|dist)/"

