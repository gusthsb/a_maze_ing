[metadata]
name = mazegen
version = 1.0.0
description = Reusable maze generator and BFS shortest-path solver (42 A-Maze-ing)
long_description = file: README.md
long_description_content_type = text/markdown
author = gusthsb
author_email = gustavo.hdsbrito@gmail.com
license = MIT
license_files = LICENSE.md
url = https://github.com/gusthsb/a_maze_ing

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
where = .
include = mazegen*

[options.extras_require]
dev =
    flake8
    mypy
    pytest
    build

[flake8]
max-line-length = 79
exclude =
    .git,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
    .ruff_cache,
    .venv,
    venv,
    ENV,
    build,
    dist,
    *.egg-info

